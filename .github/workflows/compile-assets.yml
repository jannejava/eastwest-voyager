name: Compile Assets

on:
  push:
    branches:
      - '1.*'
    paths:
      - 'resources/assets/**'
      - 'package.json'

jobs:
  compile-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm install

      - name: Compile Assets
        run: npm run prod

      - name: Check for changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Assets have changed. Please commit compiled assets."
            git diff --stat
            exit 1
          fi
